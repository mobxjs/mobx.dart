name: mobx_lint
description: mobx_lint is a developer tool for users of mobx, designed to help stop common issues and simplify repetitive tasks.
version: 1.1.0

homepage: https://mobx.netlify.app/
repository: https://github.com/mobxjs/mobx.dart
issue_tracker: https://github.com/mobxjs/mobx.dart/issues
topics:
  - devtool
  - lint
  - mobx

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  analyzer: ^8.4.0
  analyzer_plugin: ^0.13.10
  collection: ^1.19.1
  custom_lint_builder: ^0.8.1
  meta: ^1.19.0
  path: ^1.9.1
  mobx: ^2.6.1
dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1

# Run with the root workspace's Melos runtime through tool/version_lint.dart.
# Keeping Melos out of this resolver avoids custom_lint's cli_util conflict.
melos:
  useRootAsPackage: true
  command:
    version:
      hooks:
        preCommit: dart run ../tool/expose_version.dart
