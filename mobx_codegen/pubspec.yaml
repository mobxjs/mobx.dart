name: mobx_codegen
description: Code generator for MobX that adds support for annotating your code with @observable, @computed, @action and also creating Store classes.
version: 2.8.0

repository: https://github.com/mobxjs/mobx.dart
issue_tracker: https://github.com/mobxjs/mobx.dart/issues
homepage: https://mobx.netlify.app
topics:
  - reactive-programming
  - state-management
  - codegen

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  analyzer: ^13.3.0
  build: ^4.0.11
  meta: ^1.19.0
  mobx: ^2.7.0
  path: ^1.9.1
  source_gen: ^4.2.4

dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.5.20
  coverage: ^1.15.1
  lints: ^6.1.0
  logging: ^1.3.0
  mocktail: ^1.0.5
  test: ^1.31.1
  dart_style: ^3.1.13

resolution: workspace
