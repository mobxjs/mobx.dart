name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [mobx, mobx_codegen, flutter_mobx, mobx_examples]
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - name: Resolve the shared Pub workspace
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze --fatal-infos .
      - name: Dart tests and coverage
        if: matrix.package == 'mobx' || matrix.package == 'mobx_codegen'
        working-directory: ${{ matrix.package }}
        run: ../tool/coverage.sh
      - name: Flutter tests and coverage
        if: matrix.package == 'flutter_mobx' || matrix.package == 'mobx_examples'
        working-directory: ${{ matrix.package }}
        run: flutter test --coverage --coverage-path coverage/lcov.txt
      - name: Wasm widget tests
        if: matrix.package == 'flutter_mobx' || matrix.package == 'mobx_examples'
        working-directory: ${{ matrix.package }}
        run: flutter test --platform chrome --wasm
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.package }}
          files: ./${{ matrix.package }}/coverage/lcov.txt

  lint_plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve independent lint toolchains
        run: |
          cd mobx_lint
          dart pub get
          cd ../mobx_lint_flutter_test
          flutter pub get
      - name: Analyze lint plugin and integration
        run: |
          cd mobx_lint
          dart analyze --fatal-infos .
          cd ../mobx_lint_flutter_test
          dart analyze --fatal-infos .
      - name: Verify Observer assist golden
        working-directory: mobx_lint_flutter_test
        run: dart test

  website:
    # Paused while website deployment moves to Cloudflare Pages.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: .
      - run: dart pub get
        working-directory: mobx_lint
      - run: dart run tool/docs_inventory.dart --check
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck
