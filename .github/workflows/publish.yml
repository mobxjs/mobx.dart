name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish_core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Publish core if new
        uses: k-paxian/dart-package-publisher@master
        with:
          relativePath: mobx
          accessToken: ${{ secrets.OAUTH_ACCESS_TOKEN }}
          refreshToken: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          suppressBuildRunner: true
          skipTests: true

  publish_dart_packages:
    needs: publish_core
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [ "mobx_codegen", "mobx_lint" ]

    steps:
      - uses: actions/checkout@v3

      - name: Publish if new
        id: publish
        uses: k-paxian/dart-package-publisher@master
        with:
          relativePath: ${{ matrix.package }}
          accessToken: ${{ secrets.OAUTH_ACCESS_TOKEN }}
          refreshToken: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          suppressBuildRunner: true
          skipTests: true

      - name: Tag commit
        if: steps.publish.outputs.success
        uses: hole19/git-tag-action@master
        env:
          TAG: ${{steps.publish.outputs.package}}-${{steps.publish.outputs.localVersion}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_flutter_packages:
    needs: publish_core
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [ "flutter_mobx" ]

    steps:
      - uses: actions/checkout@v3

      - name: Publish if new
        id: publish
        uses: k-paxian/dart-package-publisher@master
        with:
          flutter: true
          relativePath: ${{ matrix.package }}
          accessToken: ${{ secrets.OAUTH_ACCESS_TOKEN }}
          refreshToken: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          suppressBuildRunner: true
          skipTests: true

      - name: Tag commit
        if: steps.publish.outputs.success
        uses: hole19/git-tag-action@master
        env:
          TAG: ${{steps.publish.outputs.package}}-${{steps.publish.outputs.localVersion}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
